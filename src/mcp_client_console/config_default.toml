# mcp-client-console configuration

# --- SETUP BELOW ---
### This default file was created on first package run.
### Edit the values below, save, and run the package again to begin.

#------------------------
# --- SERVER SETTINGS ---
#------------------------

#NOTE http:// is only acceptable for 127.0.0.1 or localhost.

[[server]]
name = "Box_1"
url = "https://127.0.0.1:9000/mcp"  # USE https:// for anything off this machine
token = "paste your token here"     # MUST match [auth] token in that machine's server config"
# ca_cert = 'path/to/mcp.crt'       # NOTE uncomment ONLY for self-signed certs
                                    # NOTE USE single quotes only for the path. (i.e. ' = good. " = bad.)
allow_insecure = false              # ONLY to allow plain http:// off-machine. Local dev, never a real host.

[[server]]
name = "Box_2"
url = "https://127.0.0.1:9001/mcp"
token = "paste your token here"
# ca_cert = 'path/to/mcp.crt'
allow_insecure = false

[[server]]
name = "Box_3"
url = "https://127.0.0.1:9002/mcp"
token = "paste your token here"
# ca_cert = 'path/to/mcp.crt'
allow_insecure = false

### Add additional [[server]] names and urls as needed.

#---------------------
# --- LLM SETTINGS ---
#---------------------

[llm]
provider = "local"      # "local" or "api" (where your LLM is located)
max_steps = 6           # max tool calls per message (save tokens/runaway loops)

[llm.local]
model = "qwen2.5:14b"           # get your tag exactly as listed by command: ollama list
host = "http://127.0.0.1:11434"  # where ollama server listens

[llm.api]
model = "claude-mythos"              # any Anthropic model your API key can access
api_key = "paste your Anthropic API key here"   # from console.anthropic.com
host = "https://api.anthropic.com"     # Anthropic Messages API endpoint
max_tokens = 1024                      # max tokens per model reply








